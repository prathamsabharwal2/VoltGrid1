# PIPELINE DEFINITION
# Name: voltgrid-energy-retraining
# Description: Prepare energy data, train and evaluate a model
components:
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        model_input:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-prepare-data:
    executorLabel: exec-prepare-data
    outputDefinitions:
      artifacts:
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        train_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        model_output:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(\n    test_data: Input[Dataset],\n    model_input:\
          \ Input[Model],\n    metrics: Output[Metrics],\n):\n    import joblib\n\
          \    import pandas as pd\n    from sklearn.metrics import mean_absolute_error,\
          \ r2_score\n\n    data = pd.read_csv(test_data.path)\n    X = data[[\"temperature\"\
          , \"humidity\"]]\n    y = data[\"energy_usage\"]\n\n    model = joblib.load(model_input.path)\n\
          \    predictions = model.predict(X)\n\n    mae = mean_absolute_error(y,\
          \ predictions)\n    r2 = r2_score(y, predictions)\n\n    metrics.log_metric(\"\
          mean_absolute_error\", float(mae))\n    metrics.log_metric(\"r2_score\"\
          , float(r2))\n\n    print(f\"MAE: {mae:.2f}\")\n    print(f\"R2: {r2:.3f}\"\
          )\n\n"
        image: python:3.11
    exec-prepare-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - prepare_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef prepare_data(\n    train_data: Output[Dataset],\n    test_data:\
          \ Output[Dataset],\n):\n    import pandas as pd\n    from sklearn.model_selection\
          \ import train_test_split\n\n    data = pd.DataFrame({\n        \"temperature\"\
          : [\n            20, 22, 25, 28, 30, 32, 18, 24, 27, 35,\n            21,\
          \ 29, 31, 26, 23, 34, 19, 33, 36, 22,\n        ],\n        \"humidity\"\
          : [\n            40, 45, 50, 55, 60, 65, 35, 48, 52, 70,\n            42,\
          \ 58, 63, 51, 46, 68, 38, 66, 72, 44,\n        ],\n        \"energy_usage\"\
          : [\n            100, 110, 125, 140, 155, 165, 90, 120, 135, 180,\n    \
          \        105, 150, 160, 130, 115, 175, 95, 170, 185, 108,\n        ],\n\
          \    })\n\n    train, test = train_test_split(\n        data, test_size=0.25,\
          \ random_state=42\n    )\n\n    train.to_csv(train_data.path, index=False)\n\
          \    test.to_csv(test_data.path, index=False)\n\n"
        image: python:3.11
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(\n    train_data: Input[Dataset],\n    model_output:\
          \ Output[Model],\n):\n    import joblib\n    import pandas as pd\n    from\
          \ sklearn.linear_model import LinearRegression\n    from sklearn.pipeline\
          \ import Pipeline\n    from sklearn.preprocessing import StandardScaler\n\
          \n    data = pd.read_csv(train_data.path)\n    X = data[[\"temperature\"\
          , \"humidity\"]]\n    y = data[\"energy_usage\"]\n\n    model = Pipeline([\n\
          \        (\"scaler\", StandardScaler()),\n        (\"regressor\", LinearRegression()),\n\
          \    ])\n\n    model.fit(X, y)\n    joblib.dump(model, model_output.path)\n\
          \n"
        image: python:3.11
pipelineInfo:
  description: Prepare energy data, train and evaluate a model
  name: voltgrid-energy-retraining
root:
  dag:
    tasks:
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - prepare-data
        - train-model
        inputs:
          artifacts:
            model_input:
              taskOutputArtifact:
                outputArtifactKey: model_output
                producerTask: train-model
            test_data:
              taskOutputArtifact:
                outputArtifactKey: test_data
                producerTask: prepare-data
        taskInfo:
          name: evaluate-model
      prepare-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-prepare-data
        taskInfo:
          name: prepare-data
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        dependentTasks:
        - prepare-data
        inputs:
          artifacts:
            train_data:
              taskOutputArtifact:
                outputArtifactKey: train_data
                producerTask: prepare-data
        taskInfo:
          name: train-model
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
